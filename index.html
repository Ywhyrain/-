<!-- 极简折纸箭头图标（作为 Chrome/Edge 的兜底） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b7df0'/%3E%3Cpath d='M32 12 L48 37 L36 51 L36 39 L15 39 Z' fill='%23ffffff'/%3E%3C/svg%3E">

<!-- iOS 专用图标修复：在 head 中同步绘制不透明的 PNG，确保苹果系统能抓取到 -->
<script>
(function() {
  function generateAppleIcon(size) {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      var ctx = canvas.getContext('2d');
      var s = size / 64;
      
      // 必须是不透明的纯色背景
      ctx.fillStyle = '#3b7df0';
      ctx.fillRect(0, 0, size, size);
      
      // 绘制白色折纸箭头
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(32 * s, 12 * s);
      ctx.lineTo(48 * s, 37 * s);
      ctx.lineTo(36 * s, 51 * s);
      ctx.lineTo(36 * s, 39 * s);
      ctx.lineTo(15 * s, 39 * s);
      ctx.closePath();
      ctx.fill();
      
      return canvas.toDataURL('image/png');
    } catch (e) {
      return '';
    }
  }

  // 生成苹果最需要的 180x180 规格
  var png180 = generateAppleIcon(180);
  var png192 = generateAppleIcon(192);
  var png512 = generateAppleIcon(512);
  
  if (png180) {
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.setAttribute('sizes', '180x180');
    link.href = png180;
    document.head.appendChild(link);
  }
  if (png192) {
    var link192 = document.createElement('link');
    link192.rel = 'apple-touch-icon';
    link192.setAttribute('sizes', '192x192');
    link192.href = png192;
    document.head.appendChild(link192);
  }
  if (png512) {
    var link512 = document.createElement('link');
    link512.rel = 'apple-touch-icon';
    link512.setAttribute('sizes', '512x512');
    link512.href = png512;
    document.head.appendChild(link512);
  }
})();
</script>

<style>
:root {
  --bg-color: #f8f9fa;
  --toolbar-bg: #ffffff;
  --text-color: #202124;
  --text-muted: #5f6368;
  --border-color: #e0e0e0;
  --tint-color: #1a73e8;
  --panel-bg: #ffffff;
  --card-bg: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  --danger: #d93025;
}

[data-theme="dark"] {
  --bg-color: #000000;
  --toolbar-bg: #121212;
  --text-color: #e8eaed;
  --text-muted: #9aa0a6;
  --border-color: #262626;
  --tint-color: #8ab4f8;
  --panel-bg: #121212;
  --card-bg: #161616;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  --danger: #f28b82;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg-color); color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* 顶部标签页栏 */
#top-tabs-bar {
  display: flex; align-items: center; background: var(--bg-color);
  padding: 6px 8px 0 8px; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border-color);
  z-index: 1001; scrollbar-width: none;
}
#top-tabs-bar::-webkit-scrollbar { display: none; }

.top-tab {
  display: flex; align-items: center; gap: 8px; background: var(--toolbar-bg);
  padding: 5px 10px 5px 12px; border-radius: 6px 6px 0 0; font-size: 12px; max-width: 160px; min-width: 104px;
  border: 1px solid var(--border-color); border-bottom: none; cursor: pointer; color: var(--text-muted);
  position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex-shrink: 0; contain: layout style;
}
.top-tab.active { background: var(--toolbar-bg); color: var(--text-color); font-weight: 500; border-top: 2px solid var(--tint-color); border-bottom: 1px solid var(--toolbar-bg); }
.top-tab .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; padding-top: 1px; }
.top-tab .close-tab { background: transparent; border: none; color: var(--text-muted); font-size: 14px; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1; }
.top-tab .close-tab:hover { background: rgba(0,0,0,0.1); }
.new-tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; padding: 4px 10px; cursor: pointer; border-radius: 4px; }

header {
  display: flex; align-items: center; padding: 6px 10px;
  background: var(--toolbar-bg); border-bottom: 1px solid var(--border-color); z-index: 1000; gap: 4px;
}
footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--toolbar-bg); border-top: 1px solid var(--border-color); z-index: 1000; gap: 4px;
}

.icon-btn {
  background: transparent; border: none; color: var(--tint-color); padding: 6px; border-radius: 6px;
  display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; font-weight: 600;
}
.icon-btn:active { opacity: 0.5; }
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
footer .icon-btn { flex-direction: column; gap: 2px; font-size: 10px; padding: 4px 6px; flex: 1; color: var(--text-muted); }
footer .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* 地址栏 */
.address-bar {
  flex: 1; display: flex; align-items: center; background: var(--bg-color);
  border: 1px solid var(--border-color); border-radius: 18px; padding: 0 10px; height: 34px; position: relative;
}
.address-bar input {
  flex: 1; border: none; background: transparent; color: var(--text-color);
  font-size: 13px; outline: none; padding: 0 6px; text-align: center;
}
.address-bar input:focus { text-align: left; }

.progress-line {
  position: absolute; bottom: 0; left: 0; height: 2px; background: var(--tint-color);
  width: 0%; transition: width 0.25s ease-out; border-radius: 0 0 18px 18px; opacity: 0;
}
.loading .progress-line { opacity: 1; animation: loading 1.5s infinite ease-out; }
@keyframes loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 95%; } }

main { flex: 1; position: relative; background: var(--bg-color); overflow: hidden; }

/* 内嵌 Web 容器 */
#frames-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
iframe { width: 100%; height: 100%; border: none; background: var(--card-bg); display: none; position: absolute; inset: 0; }
iframe.active { display: block; pointer-events: auto; }

/* 主页 */
#home-view {
  position: absolute; inset: 0; z-index: 20; overflow-y: auto; padding: 22px 20px 30px;
  display: flex; flex-direction: column; align-items: center; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.brand-logo-wrap { margin-bottom: 12px; }
.brand-logo { width: 58px; height: 58px; display: block; }
.greeting { font-size: 23px; font-weight: 700; margin-top: 2px; margin-bottom: 10px; text-align: center; }
.network-badge {
  display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color);
  padding: 5px 12px; border-radius: 16px; font-size: 12px; color: var(--text-muted);
  margin-bottom: 18px; cursor: pointer; box-shadow: var(--shadow); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.api-dashboard { width: 100%; max-width: 640px; margin-bottom: 12px; }
.api-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); }
.api-card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.weather-info { display: flex; align-items: center; gap: 12px; }
.weather-temp { font-size: 28px; font-weight: 700; color: var(--tint-color); }
.weather-desc { font-size: 12px; }

/* 主页大搜索框 */
.home-google-search {
  width: 100%; max-width: 640px; display: flex; align-items: center;
  background: var(--card-bg); border: 1px solid var(--border-color);
  border-radius: 30px; padding: 0 22px; height: 58px; box-shadow: var(--shadow);
  margin-bottom: 22px; transition: border-color .18s ease, box-shadow .18s ease;
  will-change: border-color;
}
@media (hover: hover) {
  .home-google-search:hover { border-color: var(--tint-color); box-shadow: 0 4px 18px rgba(26,115,232,0.18); }
}
.home-google-search:focus-within {
  border-color: var(--tint-color);
  box-shadow: 0 4px 18px rgba(26,115,232,0.22);
}
.home-google-search svg { margin-right: 14px; flex-shrink: 0; fill: var(--text-muted); width: 22px; height: 22px; }
.home-google-search input {
  flex: 1; border: none; background: transparent; color: var(--text-color);
  font-size: 16.5px; outline: none; min-width: 0;
}

/* 面板与设置 */
.overlay-panel {
  position: absolute; inset: 0; background: var(--bg-color); z-index: 2000;
  transform: translateY(100%); display: flex; flex-direction: column;
  transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
  will-change: transform;
}
.overlay-panel.show { transform: translateY(0); }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 16px; background: var(--toolbar-bg); }
.panel-content { flex: 1; overflow-y: auto; padding: 16px; }
.clear-all-btn { display: block; width: 100%; padding: 10px; margin-bottom: 12px; background: var(--card-bg); color: var(--danger); border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; }
.setting-group { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
.setting-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 15px; gap: 10px; }
.setting-item:last-child { border-bottom: none; }
.setting-item select { font-size: 14px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; }

.bottom-search-bar { flex: 2; min-width: 120px; display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 0 10px; height: 32px; margin: 0 4px; }
.bottom-search-bar input { flex: 1; border: none; background: transparent; color: var(--text-color); font-size: 12px; outline: none; text-align: center; min-width: 0; }
@media (max-width:500px) { footer .icon-btn span { display: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- 内置极简图标 -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="qzLogo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#3b7df0"></rect>
      <path d="M32 12 L48 37 L36 51 L36 39 L15 39 Z" fill="#ffffff"></path>
    </symbol>
  </defs>
</svg>

<div id="top-tabs-bar">
  <div id="tabs-container" style="display:flex; gap:4px; flex:1; overflow-x:auto; scrollbar-width:none;"></div>
  <button class="new-tab-btn" onclick="createNewTab()" title="新标签页">+</button>
</div>

<header>
  <button class="icon-btn" id="back-btn" onclick="goBack()" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="icon-btn" id="forward-btn" onclick="goForward()" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="address-bar" id="address-wrap">
    <div class="progress-line" id="progress"></div>
    <input type="text" id="url-input" placeholder="搜索或输入网址" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="handleKeyDown(event)" data-i18n-placeholder="searchPlaceholder">
  </div>
  <button class="icon-btn" id="reload-btn" onclick="reloadPage()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/></svg></button>
  <button class="icon-btn" id="settings-btn" onclick="toggleSettingsView(true)">⚙️</button>
  <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌓</button>
</header>

<main>
  <div id="home-view">
    <div class="brand-logo-wrap">
      <svg class="brand-logo" aria-hidden="true"><use href="#qzLogo"></use></svg>
    </div>
    <div class="greeting" id="greeting-text">下午好</div>
    <div class="network-badge" id="network-badge" onclick="copyIP()"><span>🌐</span><span id="network-location" data-i18n="locating">定位中...</span></div>

    <!-- 大搜索框 -->
    <div class="home-google-search">
      <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
      </svg>
      <input type="text" id="home-search-input" placeholder="在轻舟中搜索..." onkeydown="handleHomeKeyDown(event)" autocomplete="off" autocapitalize="off" enterkeyhint="search" data-i18n-placeholder="homeSearchPlaceholder">
    </div>

    <div class="api-dashboard" id="api-dashboard">
      <div class="api-card">
        <div class="api-card-title"><span data-i18n="weatherTitle">📍 本地天气</span><span id="weather-city" style="font-size:10px;" data-i18n="locating">定位中...</span></div>
        <div class="weather-info">
          <div class="weather-temp" id="weather-temp">--°</div>
          <div class="weather-desc">
            <div id="weather-desc-text" data-i18n="loading">加载中</div>
            <div id="weather-wind" style="font-size:10px; color:var(--text-muted);">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="frames-container"></div>

  <div id="panel-view" class="overlay-panel">
    <div class="panel-header"><span id="panel-title">收藏夹</span><button class="icon-btn" onclick="togglePanel(false)">关闭</button></div>
    <div class="panel-content" id="panel-content"></div>
  </div>

  <div id="settings-view" class="overlay-panel">
    <div class="panel-header"><span data-i18n="settings">设置</span><button class="icon-btn" onclick="toggleSettingsView(false)">完成</button></div>
    <div class="panel-content">
      <div class="setting-group">
        <div class="setting-item"><span data-i18n="language">语言 / Language</span><select id="lang-select" onchange="applyLanguage(this.value)"><option value="auto">自动（跟随网络/IP环境）</option><option value="zh">简体中文</option><option value="en">English</option></select></div>
        <div class="setting-item"><span data-i18n="theme">主题</span><select id="theme-select" onchange="setTheme(this.value)"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
      </div>
      <button class="clear-all-btn" onclick="clearData()" data-i18n="clearData">清除所有数据</button>
      <div style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:20px;">轻舟 v1.5</div>
    </div>
  </div>
</main>

<footer>
  <button class="icon-btn" onclick="togglePanel('bookmarks')"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg><span data-i18n="bookmarks">书签</span></button>
  <button class="icon-btn" onclick="togglePanel('history')"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg><span data-i18n="history">历史</span></button>
  <div class="bottom-search-bar"><input type="text" id="bottom-search-input" placeholder="在网页中搜索..." onkeydown="handleBottomKeyDown(event)" autocomplete="off" data-i18n-placeholder="bottomSearchPlaceholder"></div>
  <button class="icon-btn" onclick="showHome()"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-i18n="home">主页</span></button>
</footer>

<script>
"use strict";

/* ==================== i18n ==================== */
var i18n = {
  zh: {
    appTitle: "轻舟", searchPlaceholder: "搜索或输入网址",
    homeSearchPlaceholder: "在轻舟中搜索...", bottomSearchPlaceholder: "在网页中搜索...",
    bookmarks: "书签", history: "历史", home: "主页", settings: "设置",
    theme: "主题", language: "语言 / Language", clearData: "清除所有数据",
    alertClearData: "确定要清除本设备上的所有数据吗？",
    networkLocation: "网络环境", locating: "定位中...", networkFail: "获取失败",
    weatherTitle: "📍 本地天气", loading: "加载中", windSpeed: "风速: ", weatherFail: "天气加载失败",
    greetingMorning: "早上好", greetingAfternoon: "下午好", greetingEvening: "晚上好", greetingReady: "，准备探索世界？",
    ipCopied: "已复制 IP：", newTab: "起始页", noRecords: "暂无记录（本设备本地独立隔离）", local: "本地"
  },
  en: {
    appTitle: "Light Boat", searchPlaceholder: "Search or enter address",
    homeSearchPlaceholder: "Search in Light Boat...", bottomSearchPlaceholder: "Search the web...",
    bookmarks: "Bookmarks", history: "History", home: "Home", settings: "Settings",
    theme: "Theme", language: "Language / 语言", clearData: "Clear All Data",
    alertClearData: "Are you sure you want to clear all data on this device?",
    networkLocation: "Network", locating: "Detecting...", networkFail: "Failed",
    weatherTitle: "📍 Local Weather", loading: "Loading", windSpeed: "Wind: ", weatherFail: "Failed to load weather",
    greetingMorning: "Good morning", greetingAfternoon: "Good afternoon", greetingEvening: "Good evening", greetingReady: ", ready to explore?",
    ipCopied: "IP copied: ", newTab: "New Tab", noRecords: "No records yet (isolated to this device)", local: "Local"
  }
};

var currentLangSetting = 'auto';
try { currentLangSetting = localStorage.getItem('qz_lang') || 'auto'; } catch (e) {}
var currentLang = 'en';
function t(key) { return (i18n[currentLang] && i18n[currentLang][key]) || key; }

/* ==================== 主题 ==================== */
var themeSetting = 'auto';
try { themeSetting = localStorage.getItem('qz_theme') || 'auto'; } catch (e) {}
var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

function applyThemeToDOM() {
  var actual = themeSetting === 'auto' ? (systemDark ? 'dark' : 'light') : themeSetting;
  document.documentElement.setAttribute('data-theme', actual);
  var sel = document.getElementById('theme-select');
  if (sel) sel.value = themeSetting;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', actual === 'dark' ? '#000000' : '#f2f2f7');
}
function setTheme(val) {
  themeSetting = val;
  try { localStorage.setItem('qz_theme', val); } catch (e) {}
  applyThemeToDOM();
}
function toggleTheme() {
  themeSetting = themeSetting === 'auto' ? (systemDark ? 'light' : 'dark') : (themeSetting === 'light' ? 'dark' : 'light');
  setTheme(themeSetting);
}
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onSchemeChange = function (e) {
    systemDark = e.matches;
    if (themeSetting === 'auto') applyThemeToDOM();
  };
  if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
  else if (mq.addListener) mq.addListener(onSchemeChange);
}

/* ==================== 网络信息 ==================== */
var networkInfo = { country: '', countryCode: '', city: '', ip: '', lat: null, lon: null };
var netPromise = null;
var netDone = false;

var countryZhMap = { CN: '中国', US: '美国', JP: '日本', KR: '韩国', GB: '英国', FR: '法国', DE: '德国', SG: '新加坡', HK: '中国香港', TW: '中国台湾', MO: '中国澳门', CA: '加拿大', AU: '澳大利亚', IN: '印度', RU: '俄罗斯', BR: '巴西', NL: '荷兰', ES: '西班牙', IT: '意大利', TH: '泰国', MY: '马来西亚', VN: '越南', ID: '印度尼西亚', PH: '菲律宾' };
var countryEnMap = { CN: 'China', US: 'United States', JP: 'Japan', KR: 'South Korea', GB: 'United Kingdom', FR: 'France', DE: 'Germany', SG: 'Singapore', HK: 'Hong Kong', TW: 'Taiwan', MO: 'Macau', CA: 'Canada', AU: 'Australia', IN: 'India', RU: 'Russia', BR: 'Brazil' };

var tzCountryMap = {
  'Asia/Shanghai': 'CN', 'Asia/Chongqing': 'CN', 'Asia/Urumqi': 'CN', 'Asia/Harbin': 'CN',
  'Asia/Taipei': 'TW', 'Asia/Hong_Kong': 'HK', 'Asia/Macau': 'MO', 'Asia/Singapore': 'SG',
  'Asia/Tokyo': 'JP', 'Asia/Seoul': 'KR', 'Asia/Bangkok': 'TH', 'Asia/Kolkata': 'IN',
  'Asia/Jakarta': 'ID', 'Asia/Manila': 'PH', 'Asia/Kuala_Lumpur': 'MY', 'Asia/Ho_Chi_Minh': 'VN',
  'Europe/London': 'GB', 'Europe/Paris': 'FR', 'Europe/Berlin': 'DE', 'Europe/Moscow': 'RU',
  'Europe/Amsterdam': 'NL', 'Europe/Madrid': 'ES', 'Europe/Rome': 'IT',
  'America/New_York': 'US', 'America/Chicago': 'US', 'America/Denver': 'US',
  'America/Los_Angeles': 'US', 'America/Phoenix': 'US', 'America/Toronto': 'CA',
  'America/Vancouver': 'CA', 'Australia/Sydney': 'AU', 'Australia/Melbourne': 'AU',
  'Pacific/Auckland': 'NZ', 'America/Sao_Paulo': 'BR'
};

function getTimezoneCountry() {
  var tz = '';
  try { tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || ''; } catch (e) {}
  var code = tzCountryMap[tz] || '';
  if (!code && tz.indexOf('America/') === 0) code = 'US';
  if (!code && tz.indexOf('Europe/') === 0) code = 'GB';
  return { tz: tz, code: code };
}

function getCountryName() {
  if (currentLang === 'zh') return countryZhMap[networkInfo.countryCode] || networkInfo.country || networkInfo.countryCode || '';
  return countryEnMap[networkInfo.countryCode] || networkInfo.country || networkInfo.countryCode || '';
}

function evaluateAutoLanguage() {
  if (networkInfo.countryCode) return ['CN', 'TW', 'HK', 'SG', 'MO'].indexOf(networkInfo.countryCode) !== -1 ? 'zh' : 'en';
  var tzc = getTimezoneCountry();
  if (tzc.code) return ['CN', 'TW', 'HK', 'SG', 'MO'].indexOf(tzc.code) !== -1 ? 'zh' : 'en';
  return (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
}

function fetchJSON(url, ms) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, ms || 5000);
  return fetch(url, { signal: ctrl.signal, cache: 'no-store', referrerPolicy: 'no-referrer' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .finally(function () { clearTimeout(timer); });
}

function firstSuccess(promises) {
  return new Promise(function (resolve, reject) {
    var pending = promises.length, settled = false;
    if (!pending) return reject(new Error('no sources'));
    promises.forEach(function (p) {
      Promise.resolve(p).then(function (v) {
        if (!settled) { settled = true; resolve(v); }
      }).catch(function (err) {
        pending--;
        if (pending === 0 && !settled) reject(err);
      });
    });
  });
}

function srcIpwho() { return fetchJSON('https://ipwho.is/', 4500).then(function(d) { if (!d || d.success === false || !d.ip) throw new Error('ipwho'); return { ip: d.ip, country: d.country || '', countryCode: (d.country_code || '').toUpperCase(), city: d.city || '', lat: typeof d.latitude === 'number' ? d.latitude : null, lon: typeof d.longitude === 'number' ? d.longitude : null }; }); }
function srcIpapi() { return fetchJSON('https://ipapi.co/json/', 4500).then(function(d) { if (!d || d.error || !d.ip) throw new Error('ipapi'); return { ip: d.ip, country: d.country_name || '', countryCode: (d.country_code || '').toUpperCase(), city: d.city || '', lat: typeof d.latitude === 'number' ? d.latitude : null, lon: typeof d.longitude === 'number' ? d.longitude : null }; }); }
function srcIpinfo() { return fetchJSON('https://ipinfo.io/json', 4500).then(function(d) { if (!d || !d.ip) throw new Error('ipinfo'); var loc = (d.loc || '').split(','); return { ip: d.ip, country: '', countryCode: (d.country || '').toUpperCase(), city: d.city || '', lat: loc[0] ? Number(loc[0]) : null, lon: loc[1] ? Number(loc[1]) : null }; }); }
function srcIpify() { return fetchJSON('https://api.ipify.org?format=json', 4000).then(function(d) { if (!d || !d.ip) throw new Error('ipify'); var tzc = getTimezoneCountry(); return { ip: d.ip, country: '', countryCode: tzc.code || '', city: '', lat: null, lon: null }; }); }

function detectNetworkLocation() {
  if (netPromise) return netPromise;
  if (netDone && networkInfo.ip) { renderNetworkBadge(); return Promise.resolve(networkInfo); }
  var loc = document.getElementById('network-location');
  if (loc && !networkInfo.ip) loc.textContent = t('locating');
  netPromise = firstSuccess([srcIpwho(), srcIpapi()])
    .catch(function () { return firstSuccess([srcIpinfo(), srcIpify()]); })
    .then(function (info) {
      if (info.ip) networkInfo.ip = info.ip;
      if (info.country) networkInfo.country = info.country;
      if (info.countryCode) networkInfo.countryCode = info.countryCode;
      if (info.city) networkInfo.city = info.city;
      if (typeof info.lat === 'number' && isFinite(info.lat)) networkInfo.lat = info.lat;
      if (typeof info.lon === 'number' && isFinite(info.lon)) networkInfo.lon = info.lon;
      netDone = !!(networkInfo.ip || networkInfo.countryCode);
      if (currentLangSetting === 'auto') applyLanguage('auto');
      else renderNetworkBadge();
      return networkInfo;
    })
    .catch(function () {
      var tzc = getTimezoneCountry();
      if (!networkInfo.countryCode && tzc.code) {
        networkInfo.countryCode = tzc.code;
        if (currentLangSetting === 'auto') { applyLanguage('auto'); return networkInfo; }
      }
      renderNetworkBadge();
      return networkInfo;
    })
    .finally(function () { netPromise = null; });
  return netPromise;
}

function renderNetworkBadge() {
  var loc = document.getElementById('network-location');
  if (!loc) return;
  var country = getCountryName(), city = networkInfo.city || '', ip = networkInfo.ip || '';
  if (!country && !city && !ip) {
    loc.textContent = t('networkLocation') + (currentLang === 'zh' ? '：' : ': ') + t('locating');
    return;
  }
  var parts = [];
  if (country) parts.push(country);
  if (city) parts.push(city);
  if (ip) parts.push(ip);
  loc.textContent = t('networkLocation') + (currentLang === 'zh' ? '：' : ': ') + parts.join(currentLang === 'zh' ? ' · ' : ', ');
}

function copyIP() {
  if (!networkInfo.ip) { detectNetworkLocation(); return; }
  var done = function () {
    var loc = document.getElementById('network-location');
    if (!loc) return;
    loc.textContent = t('ipCopied') + networkInfo.ip;
    setTimeout(renderNetworkBadge, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(networkInfo.ip).then(done).catch(done);
  } else { done(); }
}

/* ==================== 语言 ==================== */
function applyLanguage(setting) {
  currentLangSetting = setting;
  try { localStorage.setItem('qz_lang', setting); } catch (e) {}
  currentLang = (setting === 'auto') ? evaluateAutoLanguage() : setting;
  var selectEl = document.getElementById('lang-select');
  if (selectEl) selectEl.value = setting;
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.title = t('appTitle');
  updateGreeting();
  renderNetworkBadge();
  renderTopTabs();
}

function updateGreeting() {
  var h = new Date().getHours(), key = 'greetingAfternoon';
  if (h < 12) key = 'greetingMorning'; else if (h >= 18) key = 'greetingEvening';
  var el = document.getElementById('greeting-text');
  if (el) el.textContent = t(key) + t('greetingReady');
}

/* ==================== 天气 ==================== */
var weatherCodesZh = { 0: '晴', 1: '晴间少云', 2: '多云', 3: '阴', 45: '雾', 48: '雾凇', 51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨', 56: '冻毛毛雨', 57: '强冻毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨', 66: '冻雨', 67: '强冻雨', 71: '小雪', 73: '中雪', 75: '大雪', 77: '米雪', 80: '阵雨', 81: '强阵雨', 82: '暴雨', 85: '阵雪', 86: '强阵雪', 95: '雷阵雨', 96: '雷阵雨伴冰雹', 99: '强雷阵雨伴冰雹' };
var weatherCodesEn = { 0: 'Clear', 1: 'Mostly Clear', 2: 'Partly Cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Rime Fog', 51: 'Light Drizzle', 53: 'Drizzle', 55: 'Dense Drizzle', 56: 'Freezing Drizzle', 57: 'Freezing Drizzle', 61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain', 66: 'Freezing Rain', 67: 'Freezing Rain', 71: 'Light Snow', 73: 'Snow', 75: 'Heavy Snow', 77: 'Snow Grains', 80: 'Showers', 81: 'Showers', 82: 'Violent Showers', 85: 'Snow Showers', 86: 'Snow Showers', 95: 'Thunderstorm', 96: 'Thunderstorm + Hail', 99: 'Thunderstorm + Hail' };

var weatherCityName = '', lastWeatherFetch = 0, weatherBusy = false, geoAsked = false;

function fetchWeatherByCoords(lat, lon, cityName) {
  if (typeof lat !== 'number' || typeof lon !== 'number' || !isFinite(lat) || !isFinite(lon)) return;
  if (cityName) weatherCityName = cityName;
  var cityEl = document.getElementById('weather-city');
  if (cityEl) cityEl.textContent = weatherCityName || t('local');
  if (weatherBusy) return;
  weatherBusy = true;
  var map = currentLang === 'zh' ? weatherCodesZh : weatherCodesEn;
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code,wind_speed_10m';
  fetchJSON(url, 7000)
    .then(function (data) {
      if (!data || !data.current) throw new Error('bad weather data');
      var cw = data.current;
      document.getElementById('weather-temp').textContent = Math.round(cw.temperature_2m) + '°';
      document.getElementById('weather-desc-text').textContent = map[cw.weather_code] || (currentLang === 'zh' ? '晴朗' : 'Clear');
      var wind = (typeof cw.wind_speed_10m === 'number') ? Math.round(cw.wind_speed_10m) : '--';
      document.getElementById('weather-wind').textContent = t('windSpeed') + wind + ' km/h';
      lastWeatherFetch = Date.now();
    })
    .catch(function () { var d = document.getElementById('weather-desc-text'); if (d) d.textContent = t('weatherFail'); })
    .finally(function () { weatherBusy = false; });
}

function refreshWeather() {
  if (networkInfo.lat !== null && networkInfo.lon !== null) fetchWeatherByCoords(networkInfo.lat, networkInfo.lon);
  else fetchWeatherByCoords(39.9042, 116.4074, t('local'));
}

function tryPreciseLocation() {
  if (geoAsked || !navigator.geolocation) return;
  geoAsked = true;
  navigator.geolocation.getCurrentPosition(
    function (pos) { fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude); },
    function () {},
    { timeout: 8000, maximumAge: 600000, enableHighAccuracy: false }
  );
}

function initWeather() {
  detectNetworkLocation().then(function () {
    refreshWeather();
    setTimeout(function () {
      if (document.hidden) return;
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function (p) { if (p.state === 'granted') tryPreciseLocation(); }).catch(function () {});
      }
    }, 2500);
  });
}

/* ==================== 标签页与导航 ==================== */
var tabs = [{ id: 'tab_init', type: 'home', title: '', url: '', iframe: null, history: [{ type: 'home' }], historyIndex: 0 }];
var activeTabId = 'tab_init';

var $urlInput = document.getElementById('url-input');
var $framesContainer = document.getElementById('frames-container');
var $homeView = document.getElementById('home-view');
var $panelView = document.getElementById('panel-view');
var $settingsView = document.getElementById('settings-view');
var $panelTitle = document.getElementById('panel-title');
var $panelContent = document.getElementById('panel-content');
var $addressWrap = document.getElementById('address-wrap');
var $backBtn = document.getElementById('back-btn');
var $forwardBtn = document.getElementById('forward-btn');

function tabTitle(tab) {
  if (tab.type === 'home') return t('newTab');
  return tab.title || t('newTab');
}

function renderTopTabs() {
  var container = document.getElementById('tabs-container');
  var frag = document.createDocumentFragment();
  tabs.forEach(function (tab) {
    var el = document.createElement('div');
    el.className = 'top-tab' + (tab.id === activeTabId ? ' active' : '');
    el.dataset.id = tab.id;
    var span = document.createElement('span');
    span.className = 'tab-title';
    span.textContent = tabTitle(tab);
    var close = document.createElement('button');
    close.className = 'close-tab';
    close.dataset.id = tab.id;
    close.textContent = '×';
    el.appendChild(span);
    el.appendChild(close);
    frag.appendChild(el);
  });
  container.textContent = '';
  container.appendChild(frag);
}

function updateTabActiveStates() {
  var els = document.querySelectorAll('#tabs-container .top-tab');
  for (var i = 0; i < els.length; i++) {
    els[i].classList.toggle('active', els[i].dataset.id === activeTabId);
  }
}

(function bindTabsEvents() {
  var container = document.getElementById('tabs-container');
  container.addEventListener('click', function (e) {
    var closeBtn = e.target.closest ? e.target.closest('.close-tab') : null;
    if (closeBtn) { e.stopPropagation(); closeTab(closeBtn.dataset.id); return; }
    var tabEl = e.target.closest ? e.target.closest('.top-tab') : null;
    if (tabEl) switchTab(tabEl.dataset.id);
  }, { passive: true });
})();

function applyTabState(tab, state) {
  tab.type = state.type;
  if (state.type === 'url') {
    tab.url = state.url;
    if (state.title) tab.title = state.title;
  }
  var isHome = state.type === 'home';
  $homeView.style.display = isHome ? 'flex' : 'none';

  tabs.forEach(function (t) {
    if (t.iframe) {
      var shouldShow = (t.id === activeTabId) && !isHome;
      if (shouldShow) t.iframe.classList.add('active');
      else t.iframe.classList.remove('active');
    }
  });

  if (!isHome) {
    var iframe = tab.iframe;
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = 'frame_' + tab.id;
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
      iframe.src = state.url;
      $framesContainer.appendChild(iframe);
      tab.iframe = iframe;
    } else if (iframe.dataset.url !== state.url) {
      iframe.dataset.url = state.url;
      iframe.src = state.url;
    }
    iframe.classList.add('active');
    $urlInput.value = state.url;
  } else {
    $urlInput.value = '';
    $addressWrap.classList.remove('loading');
  }
  updateTabActiveStates();
}

function switchTab(id) {
  var tab = tabs.find(function (x) { return x.id === id; });
  if (!tab) return;
  activeTabId = id;
  var currentState = tab.history[tab.historyIndex] || { type: 'home' };
  applyTabState(tab, currentState);
  updateNavButtons();
}

function goBack() {
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (tab && tab.historyIndex > 0) {
    tab.historyIndex--;
    applyTabState(tab, tab.history[tab.historyIndex]);
    updateNavButtons();
  }
}

function goForward() {
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (tab && tab.historyIndex < tab.history.length - 1) {
    tab.historyIndex++;
    applyTabState(tab, tab.history[tab.historyIndex]);
    updateNavButtons();
  }
}

function updateNavButtons() {
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (!tab) return;
  $backBtn.disabled = (tab.historyIndex <= 0);
  $forwardBtn.disabled = (tab.historyIndex >= tab.history.length - 1);
}

function createNewTab() {
  if (tabs.length >= 10) {
    var victim = tabs.find(function (x) { return x.id !== activeTabId; });
    if (victim) {
      if (victim.iframe) { victim.iframe.remove(); victim.iframe = null; }
      tabs.splice(tabs.indexOf(victim), 1);
    }
  }
  var id = 'tab_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  tabs.push({ id: id, type: 'home', title: '', url: '', iframe: null, history: [{ type: 'home' }], historyIndex: 0 });
  activeTabId = id;
  renderTopTabs();
  switchTab(id);
}

function closeTab(id) {
  var index = tabs.findIndex(function (x) { return x.id === id; });
  if (index === -1) return;
  if (tabs[index].iframe) { tabs[index].iframe.remove(); tabs[index].iframe = null; }
  tabs.splice(index, 1);
  if (tabs.length === 0) { createNewTab(); return; }
  if (activeTabId === id) activeTabId = tabs[Math.max(0, index - 1)].id;
  renderTopTabs();
  switchTab(activeTabId);
}

/* ==================== 搜索与导航 ==================== */
function normalizeUrl(input) {
  var q = String(input || '').trim();
  if (!q) return '';
  if (/^(https?:\/\/)?([\w\-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(q) && q.indexOf(' ') === -1) {
    return /^https?:\/\//i.test(q) ? q : 'https://' + q;
  }
  // 恢复国外 Bing
  return 'https://www.bing.com/search?q=' + encodeURIComponent(q);
}

function processNavigationInCurrentTab(input, isHistoryAction) {
  var processedUrl = normalizeUrl(input);
  if (!processedUrl) return;
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (!tab) return;
  var title = String(input || '').trim().slice(0, 60);
  if (!title) { try { title = new URL(processedUrl).hostname; } catch (e) { title = processedUrl.slice(0, 60); } }
  var stateObj = { type: 'url', url: processedUrl, title: title };
  if (!isHistoryAction) {
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(stateObj);
    tab.historyIndex = tab.history.length - 1;
  }
  applyTabState(tab, stateObj);
  updateNavButtons();
  renderTopTabs();
}

function handleKeyDown(e) { if (e.key === 'Enter') { processNavigationInCurrentTab(e.target.value, false); e.target.blur(); } }
function handleHomeKeyDown(e) { if (e.key === 'Enter') { var v = e.target.value; processNavigationInCurrentTab(v, false); e.target.value = ''; e.target.blur(); } }
function handleBottomKeyDown(e) { if (e.key === 'Enter') { var v = e.target.value; processNavigationInCurrentTab(v, false); e.target.value = ''; e.target.blur(); } }

function showHome() {
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (!tab) return;
  tab.history = [{ type: 'home' }];
  tab.historyIndex = 0;
  tab.title = '';
  applyTabState(tab, { type: 'home' });
  updateNavButtons();
  renderTopTabs();
}

function reloadPage() {
  var tab = tabs.find(function (x) { return x.id === activeTabId; });
  if (!tab) return;
  var state = tab.history[tab.historyIndex];
  if (state && state.type === 'url' && tab.iframe) {
    tab.iframe.dataset.url = state.url;
    tab.iframe.src = state.url;
  } else {
    applyTabState(tab, state || { type: 'home' });
  }
}

/* ==================== 面板 / 设置 ==================== */
function toggleSettingsView(show) { $settingsView.classList.toggle('show', !!show); }
function togglePanel(type) {
  if (!type) { $panelView.classList.remove('show'); return; }
  $panelView.classList.add('show');
  $panelTitle.textContent = (type === 'bookmarks') ? t('bookmarks') : t('history');
  $panelContent.innerHTML = '<p style="text-align:center;color:var(--text-muted);margin-top:40px;">' + t('noRecords') + '</p>';
}
function clearData() { if (confirm(t('alertClearData'))) { try { localStorage.clear(); } catch (e) {} location.reload(); } }

/* ==================== 刷新策略 ==================== */
function initRefreshPolicy() {
  setInterval(function () {
    if (document.hidden) return;
    if (Date.now() - lastWeatherFetch > 900000) refreshWeather();
  }, 300000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (!networkInfo.ip && !networkInfo.countryCode) detectNetworkLocation();
    if (Date.now() - lastWeatherFetch > 900000) refreshWeather();
  });
}

/* ==================== 启动 ==================== */
applyThemeToDOM();
applyLanguage(currentLangSetting);
renderTopTabs();
switchTab('tab_init');
updateNavButtons();
initWeather();
initRefreshPolicy();
</script>
