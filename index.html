<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>轻舟</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjMjY3NWU4Ii8+PHBhdGggZD0iTTUwIDIwIEw4MCA1MCBMNjAgODAgTDQwIDUwIEwyMCA1MCBaIiBmaWxsPSIjZmZmIi8+PC9zdmc+"/>
<style>
:root {
  --bg-color: #f8f9fa;
  --toolbar-bg: #ffffff; 
  --text-color: #202124;
  --text-muted: #5f6368;
  --border-color: #e0e0e0;
  --tint-color: #1a73e8;
  --panel-bg: #ffffff;
  --card-bg: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  --danger: #d93025;
}

/* 极致 OLED 纯黑深色模式 */
[data-theme="dark"] {
  --bg-color: #000000;
  --toolbar-bg: #121212;
  --text-color: #e8eaed;
  --text-muted: #9aa0a6;
  --border-color: #262626;
  --tint-color: #8ab4f8;
  --panel-bg: #121212;
  --card-bg: #161616;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  --danger: #f28b82;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg-color); color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* 顶部标签页栏 */
#top-tabs-bar {
  display: flex; align-items: center; background: var(--bg-color);
  padding: 6px 8px 0 8px; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border-color);
  z-index: 1001; scrollbar-width: none;
}
#top-tabs-bar::-webkit-scrollbar { display: none; }

.top-tab {
  display: flex; align-items: center; gap: 8px; background: var(--toolbar-bg);
  padding: 5px 10px; border-radius: 6px 6px 0 0; font-size: 12px; max-width: 160px; min-width: 110px;
  border: 1px solid var(--border-color); border-bottom: none; cursor: pointer; color: var(--text-muted);
  position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-tab.active { background: var(--toolbar-bg); color: var(--text-color); font-weight: 500; border-top: 2px solid var(--tint-color); border-bottom: 1px solid var(--toolbar-bg); }
.top-tab .close-tab { background: transparent; border: none; color: var(--text-muted); font-size: 12px; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.top-tab .close-tab:hover { background: rgba(0,0,0,0.1); }
.new-tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; padding: 4px 10px; cursor: pointer; border-radius: 4px; }

header {
  display: flex; align-items: center; padding: 6px 10px;
  background: var(--toolbar-bg); border-bottom: 1px solid var(--border-color); z-index: 1000; gap: 4px;
}
footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--toolbar-bg); border-top: 1px solid var(--border-color); z-index: 1000; gap: 4px;
}

.icon-btn {
  background: transparent; border: none; color: var(--tint-color); padding: 6px; border-radius: 6px;
  display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; font-weight: 600;
}
.icon-btn:active { opacity: 0.5; }
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
footer .icon-btn { flex-direction: column; gap: 2px; font-size: 10px; padding: 4px 6px; flex: 1; color: var(--text-muted); }
footer .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* 地址栏 */
.address-bar {
  flex: 1; display: flex; align-items: center; background: var(--bg-color);
  border: 1px solid var(--border-color); border-radius: 18px; padding: 0 10px; height: 34px; position: relative;
}
.address-bar input {
  flex: 1; border: none; background: transparent; color: var(--text-color);
  font-size: 13px; outline: none; padding: 0 6px; text-align: center;
}
.address-bar input:focus { text-align: left; }

.progress-line {
  position: absolute; bottom: 0; left: 0; height: 2px; background: var(--tint-color);
  width: 0%; transition: width 0.25s ease-out; border-radius: 0 0 18px 18px; opacity: 0;
}
.loading .progress-line { opacity: 1; animation: loading 1.5s infinite ease-out; }
@keyframes loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 95%; } }

main { flex: 1; position: relative; background: var(--bg-color); overflow: hidden; }

/* 内嵌 Web 容器 */
#frames-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
iframe { width: 100%; height: 100%; border: none; background: #fff; display: none; position: absolute; inset: 0; }
iframe.active { display: block; pointer-events: auto; }

/* 主页 */
#home-view {
  position: absolute; inset: 0; z-index: 20; overflow-y: auto; padding: 30px 20px;
  display: flex; flex-direction: column; align-items: center; -webkit-overflow-scrolling: touch;
}
.greeting { font-size: 24px; font-weight: 700; margin-top: 10px; margin-bottom: 5px; text-align: center; }
.network-badge {
  display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color);
  padding: 5px 12px; border-radius: 16px; font-size: 12px; color: var(--text-muted);
  margin-bottom: 20px; cursor: pointer; box-shadow: var(--shadow);
}

.api-dashboard { width: 100%; max-width: 600px; margin-bottom: 12px; }
.api-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); }
.api-card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.weather-info { display: flex; align-items: center; gap: 10px; }
.weather-temp { font-size: 24px; font-weight: 700; color: var(--tint-color); }
.weather-desc { font-size: 12px; }

/* 主页 Bing 样式大搜索框 */
.home-google-search {
  width: 100%; max-width: 600px; display: flex; align-items: center;
  background: var(--card-bg); border: 1px solid var(--border-color);
  border-radius: 28px; padding: 0 18px; height: 48px; box-shadow: var(--shadow);
  margin-bottom: 20px; transition: all 0.2s ease;
}
.home-google-search:hover, .home-google-search:focus-within {
  border-color: var(--tint-color);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.home-google-search svg { margin-right: 12px; flex-shrink: 0; fill: var(--text-muted); }
.home-google-search input {
  flex: 1; border: none; background: transparent; color: var(--text-color);
  font-size: 15px; outline: none;
}

/* 面板与设置 */
.overlay-panel { position: absolute; inset: 0; background: var(--bg-color); z-index: 2000; transform: translateY(100%); display: flex; flex-direction: column; transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
.overlay-panel.show { transform: translateY(0); }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 16px; background: var(--toolbar-bg); }
.panel-content { flex: 1; overflow-y: auto; padding: 16px; }
.clear-all-btn { display: block; width: 100%; padding: 10px; margin-bottom: 12px; background: var(--card-bg); color: var(--danger); border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; }
.setting-group { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
.setting-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
.setting-item:last-child { border-bottom: none; }
.setting-item select { font-size: 14px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; }

.bottom-search-bar { flex: 2; min-width: 120px; display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 0 10px; height: 32px; margin: 0 4px; }
.bottom-search-bar input { flex: 1; border: none; background: transparent; color: var(--text-color); font-size: 12px; outline: none; text-align: center; }
@media (max-width:500px) { footer .icon-btn span { display: none; } }
</style>
</head>
<body>

<div id="top-tabs-bar">
  <div id="tabs-container" style="display:flex; gap:4px; flex:1; overflow-x:auto;"></div>
  <button class="new-tab-btn" onclick="createNewTab()" title="新标签页">+</button>
</div>

<header>
  <button class="icon-btn" id="back-btn" onclick="goBack()" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="icon-btn" id="forward-btn" onclick="goForward()" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="address-bar" id="address-wrap">
    <div class="progress-line" id="progress"></div>
    <input type="text" id="url-input" placeholder="搜索或输入网址" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="handleKeyDown(event)" data-i18n-placeholder="searchPlaceholder">
  </div>
  <button class="icon-btn" id="reload-btn" onclick="reloadPage()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/></svg></button>
  <button class="icon-btn" id="settings-btn" onclick="toggleSettingsView(true)">⚙️</button>
  <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌓</button>
</header>

<main>
  <div id="home-view">
    <div class="greeting" id="greeting-text">下午好</div>
    <div class="network-badge" id="network-badge" onclick="copyIP()"><span>🌐</span><span id="network-location" data-i18n="locating">定位中...</span></div>
    
    <div class="api-dashboard" id="api-dashboard">
      <div class="api-card">
        <div class="api-card-title"><span data-i18n="weatherTitle">📍 本地天气</span><span id="weather-city" style="font-size:10px;" data-i18n="locating">定位中...</span></div>
        <div class="weather-info">
          <div class="weather-temp" id="weather-temp">--°</div>
          <div class="weather-desc">
            <div id="weather-desc-text" data-i18n="loading">加载中</div>
            <div id="weather-wind" style="font-size:10px; color:var(--text-muted);">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主页大搜索框 -->
    <div class="home-google-search">
      <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
      </svg>
      <input type="text" id="home-search-input" placeholder="在全网中搜索..." onkeydown="handleHomeKeyDown(event)" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
    </div>
  </div>

  <div id="frames-container"></div>

  <div id="panel-view" class="overlay-panel">
    <div class="panel-header"><span id="panel-title">收藏夹</span><button class="icon-btn" onclick="togglePanel(false)">关闭</button></div>
    <div class="panel-content" id="panel-content"></div>
  </div>

  <div id="settings-view" class="overlay-panel">
    <div class="panel-header"><span data-i18n="settings">设置</span><button class="icon-btn" onclick="toggleSettingsView(false)">完成</button></div>
    <div class="panel-content">
      <div class="setting-group">
        <div class="setting-item"><span data-i18n="language">语言 / Language</span><select id="lang-select" onchange="applyLanguage(this.value)"><option value="auto">自动（跟随网络/IP环境）</option><option value="zh">简体中文</option><option value="en">English</option></select></div>
        <div class="setting-item"><span data-i18n="theme">主题</span><select id="theme-select" onchange="setTheme(this.value)"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
      </div>
      <button class="clear-all-btn" onclick="clearData()" data-i18n="clearData">清除所有数据</button>
      <div style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:20px;">轻舟 v1.0</div>
    </div>
  </div>
</main>

<footer>
  <button class="icon-btn" onclick="togglePanel('bookmarks')"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg><span data-i18n="bookmarks">书签</span></button>
  <button class="icon-btn" onclick="togglePanel('history')"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg><span data-i18n="history">历史</span></button>
  <div class="bottom-search-bar"><input type="text" id="bottom-search-input" placeholder="在网页中搜索..." onkeydown="handleBottomKeyDown(event)" autocomplete="off" data-i18n-placeholder="bottomSearchPlaceholder"></div>
  <button class="icon-btn" onclick="showHome()"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-i18n="home">主页</span></button>
</footer>

<script>
var i18n = {
  zh: {
    appTitle: "轻舟", searchPlaceholder: "搜索或输入网址", bottomSearchPlaceholder: "搜索网页...",
    bookmarks: "书签", history: "历史", home: "主页", settings: "设置",
    theme: "主题", language: "语言 / Language", clearData: "清除所有数据", alertClearData: "确定要清除本设备上的所有数据吗？",
    networkLocation: "网络环境", locating: "定位中...", networkFail: "获取失败",
    weatherTitle: "📍 本地天气", loading: "加载中", windSpeed: "风速: ", weatherFail: "天气加载失败",
    greetingMorning: "早上好", greetingAfternoon: "下午好", greetingEvening: "晚上好", greetingReady: "，准备探索世界？",
    ipCopied: "已复制 IP："
  },
  en: {
    appTitle: "Light Boat", searchPlaceholder: "Search or enter address", bottomSearchPlaceholder: "Search...",
    bookmarks: "Bookmarks", history: "History", home: "Home", settings: "Settings",
    theme: "Theme", language: "Language / 语言", clearData: "Clear All Data", alertClearData: "Are you sure you want to clear all data on this device?",
    networkLocation: "Network", locating: "Detecting...", networkFail: "Failed",
    weatherTitle: "📍 Local Weather", loading: "Loading", windSpeed: "Wind: ", weatherFail: "Failed to load weather",
    greetingMorning: "Good morning", greetingAfternoon: "Good afternoon", greetingEvening: "Good evening", greetingReady: ", ready to explore?",
    ipCopied: "IP copied: "
  }
};

var currentLangSetting = localStorage.getItem('qz_lang') || 'auto';
var currentLang = 'en';
function t(key) { return i18n[currentLang][key] || key; }

function evaluateAutoLanguage() {
  if (networkInfo.countryCode) {
    return ['CN', 'TW', 'HK', 'SG'].indexOf(networkInfo.countryCode) !== -1 ? 'zh' : 'en';
  }
  return (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
}

function applyLanguage(setting) {
  currentLangSetting = setting;
  localStorage.setItem('qz_lang', setting);
  
  if (setting === 'auto') {
    currentLang = evaluateAutoLanguage();
  } else {
    currentLang = setting;
  }

  var selectEl = document.getElementById('lang-select');
  if (selectEl) selectEl.value = setting;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  updateGreeting();
  renderNetworkBadge();
}

var themeSetting = localStorage.getItem('qz_theme') || 'auto';
var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

var tabs = [{ id: 'tab_init', type: 'home', title: '起始页', iframe: null, history: [{type:'home'}], historyIndex: 0 }];
var activeTabId = 'tab_init';

var $urlInput = document.getElementById('url-input');
var $framesContainer = document.getElementById('frames-container');
var $homeView = document.getElementById('home-view');
var $panelView = document.getElementById('panel-view');
var $settingsView = document.getElementById('settings-view');
var $panelTitle = document.getElementById('panel-title');
var $panelContent = document.getElementById('panel-content');
var $addressWrap = document.getElementById('address-wrap');
var $backBtn = document.getElementById('back-btn');
var $forwardBtn = document.getElementById('forward-btn');

function applyThemeToDOM() {
  var actual = themeSetting === 'auto' ? (systemDark ? 'dark' : 'light') : themeSetting;
  document.documentElement.setAttribute('data-theme', actual);
  document.getElementById('theme-select').value = themeSetting;
}
function setTheme(val) { themeSetting = val; localStorage.setItem('qz_theme', val); applyThemeToDOM(); }
function toggleTheme() {
  themeSetting = themeSetting === 'auto' ? (systemDark ? 'light' : 'dark') : (themeSetting === 'light' ? 'dark' : 'light');
  setTheme(themeSetting);
}

var networkInfo = { country: '', countryCode: '', city: '', ip: '' };
var countryZhMap = { CN: '中国', US: '美国', JP: '日本', KR: '韩国', GB: '英国', FR: '法国', DE: '德国', SG: '新加坡', HK: '中国香港', TW: '中国台湾' };
function getCountryName() { return currentLang === 'zh' && countryZhMap[networkInfo.countryCode] ? countryZhMap[networkInfo.countryCode] : (networkInfo.country || networkInfo.countryCode || ''); }

function detectNetworkLocation() {
  var loc = document.getElementById('network-location');
  if (loc) loc.textContent = t('locating');
  fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(d => {
      networkInfo.country = d.country_name || '';
      networkInfo.countryCode = (d.country_code || '').toUpperCase();
      networkInfo.city = d.city || '';
      networkInfo.ip = d.ip || '';
      if (currentLangSetting === 'auto') {
        applyLanguage('auto');
      } else {
        renderNetworkBadge();
      }
    })
    .catch(() => {
      if (loc) loc.textContent = t('networkLocation') + ': ' + t('networkFail');
    });
}

function renderNetworkBadge() {
  var loc = document.getElementById('network-location');
  if (!loc) return;
  var country = getCountryName(), city = networkInfo.city || '', ip = networkInfo.ip || '';
  if (!country && !city && !ip) {
    loc.textContent = t('networkLocation') + ': ' + t('locating');
    return;
  }
  var parts = [];
  if (country) parts.push(country);
  if (city) parts.push(city);
  if (ip) parts.push(ip);
  loc.textContent = t('networkLocation') + (currentLang === 'zh' ? '：' : ': ') + parts.join(currentLang === 'zh' ? ' · ' : ', ');
}

function copyIP() {
  if (!networkInfo.ip) return;
  navigator.clipboard.writeText(networkInfo.ip).then(() => {
    var loc = document.getElementById('network-location');
    loc.textContent = t('ipCopied') + networkInfo.ip;
    setTimeout(renderNetworkBadge, 1500);
  });
}

var weatherCodesZh = { 0: '晴', 1: '少云', 2: '多云', 3: '阴', 45: '雾', 51: '小雨', 61: '小雨', 63: '中雨', 65: '大雨', 80: '阵雨' };
var weatherCodesEn = { 0: 'Clear', 1: 'Mostly Clear', 2: 'Partly Cloudy', 3: 'Overcast', 45: 'Fog', 51: 'Drizzle', 61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain', 80: 'Showers' };

function fetchWeather() {
  var cityEl = document.getElementById('weather-city');
  if (cityEl && cityEl.textContent === t('locating')) cityEl.textContent = 'Beijing';
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      fetchWeatherByCoords(position.coords.latitude, position.coords.longitude);
    }, () => { fetchWeatherByIP(); }, { timeout: 5000 });
  } else { fetchWeatherByIP(); }
}

function fetchWeatherByIP() {
  fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(d => {
      document.getElementById('weather-city').textContent = (d.city || 'Beijing') + ' (IP)';
      fetchWeatherByCoords(Number(d.latitude), Number(d.longitude));
    })
    .catch(() => {
      document.getElementById('weather-city').textContent = 'Beijing';
      fetchWeatherByCoords(39.9042, 116.4074);
    });
}

function fetchWeatherByCoords(lat, lon) {
  var map = currentLang === 'zh' ? weatherCodesZh : weatherCodesEn;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code,wind_speed_10m')
    .then(res => res.json())
    .then(data => {
      var cw = data.current;
      document.getElementById('weather-temp').textContent = Math.round(cw.temperature_2m) + '°';
      document.getElementById('weather-desc-text').textContent = map[cw.weather_code] || (currentLang === 'zh' ? '晴朗' : 'Clear');
      document.getElementById('weather-wind').textContent = t('windSpeed') + cw.wind_speed_10m + ' km/h';
    })
    .catch(() => { document.getElementById('weather-desc-text').textContent = t('weatherFail'); });
}

function updateGreeting() {
  var h = new Date().getHours(), key = 'greetingAfternoon';
  if (h < 12) key = 'greetingMorning'; else if (h >= 18) key = 'greetingEvening';
  document.getElementById('greeting-text').textContent = t(key) + t('greetingReady');
}

// 核心优化：直接将搜索词包装为 Bing 官方搜索链接，实现“直接把 Bing 放进 iframe”
function normalizeUrl(input) {
  var q = input.trim(); if (!q) return '';
  if (/^(https?:\/\/)?([\w\-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(q) && !q.includes(' ')) {
    return /^https?:\/\//i.test(q) ? q : 'https://' + q;
  }
  return 'https://www.bing.com/search?q=' + encodeURIComponent(q);
}

function processNavigationInCurrentTab(input, isHistoryAction) {
  var processedUrl = normalizeUrl(input);
  if (!processedUrl) return;

  var tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;

  var stateObj = { type: 'url', url: processedUrl, title: input };

  if (!isHistoryAction) {
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(stateObj);
    tab.historyIndex = tab.history.length - 1;
  }

  applyTabState(tab, stateObj);
  updateNavButtons();
}

function applyTabState(tab, state) {
  tab.type = state.type;
  tab.title = state.title || '起始页';
  
  document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
  $homeView.style.display = 'none';

  if (state.type === 'home') {
    $homeView.style.display = 'flex';
    $urlInput.value = '';$addressWrap.classList.remove('loading');
    if (tab.iframe) { tab.iframe.remove(); tab.iframe = null; }
  } else if (state.type === 'url') {
    tab.url = state.url;
    var iframe = tab.iframe;
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = 'frame_' + tab.id;
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
      iframe.src = state.url;
      $framesContainer.appendChild(iframe);
      tab.iframe = iframe;
    } else if (iframe.src !== state.url) {
      iframe.src = state.url;
    }
    iframe.classList.add('active');
    $urlInput.value = state.url;
  }
  renderTopTabs();
}

function switchTab(id) {
  activeTabId = id;
  var tab = tabs.find(t => t.id === id);
  if (!tab) return;
  var currentState = tab.history[tab.historyIndex] || { type: 'home' };
  applyTabState(tab, currentState);
  updateNavButtons();
}

function goBack() {
  var tab = tabs.find(t => t.id === activeTabId);
  if (tab && tab.historyIndex > 0) {
    tab.historyIndex--;
    var state = tab.history[tab.historyIndex];
    applyTabState(tab, state);
    updateNavButtons();
  }
}

function goForward() {
  var tab = tabs.find(t => t.id === activeTabId);
  if (tab && tab.historyIndex < tab.history.length - 1) {
    tab.historyIndex++;
    var state = tab.history[tab.historyIndex];
    applyTabState(tab, state);
    updateNavButtons();
  }
}

function updateNavButtons() {
  var tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  $backBtn.disabled = (tab.historyIndex <= 0);$forwardBtn.disabled = (tab.historyIndex >= tab.history.length - 1);
}

function createNewTab() {
  var id = 'tab_' + Date.now();
  tabs.push({ id: id, type: 'home', title: '起始页', iframe: null, history: [{type:'home'}], historyIndex: 0 });
  switchTab(id);
}

function closeTab(id) {
  var index = tabs.findIndex(t => t.id === id);
  if (index === -1) return;
  if (tabs[index].iframe) tabs[index].iframe.remove();
  tabs.splice(index, 1);
  if (tabs.length === 0) createNewTab();
  else if (activeTabId === id) switchTab(tabs[Math.max(0, index - 1)].id);
  else renderTopTabs();
}

function renderTopTabs() {
  var container = document.getElementById('tabs-container');
  container.innerHTML = '';
  tabs.forEach(tab => {
    var title = tab.title || '起始页';
    var el = document.createElement('div');
    el.className = 'top-tab ' + (tab.id === activeTabId ? 'active' : '');
    el.innerHTML = `<span>🌐</span><span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${title}</span><button class="close-tab" onclick="closeTab('${tab.id}')">×</button>`;
    el.onclick = (e) => { if (e.target.className !== 'close-tab') switchTab(tab.id); };
    container.appendChild(el);
  });
}

function handleKeyDown(e) { if (e.key === 'Enter') { processNavigationInCurrentTab(e.target.value, false); e.target.blur(); } }
function handleHomeKeyDown(e) { if (e.key === 'Enter') { processNavigationInCurrentTab(e.target.value, false); e.target.value = ''; e.target.blur(); } }
function handleBottomKeyDown(e) { if (e.key === 'Enter') { processNavigationInCurrentTab(e.target.value, false); e.target.value = ''; e.target.blur(); } }

function showHome() {
  var tab = tabs.find(t => t.id === activeTabId);
  if (tab) {
    tab.history = [{type:'home'}];
    tab.historyIndex = 0;
    applyTabState(tab, {type:'home'});
    updateNavButtons();
  }
}

function toggleSettingsView(show) { $settingsView.classList.toggle('show', show); }
function togglePanel(type) {
  if (!type) { $panelView.classList.remove('show'); return; }
  $panelView.classList.add('show');$panelTitle.textContent = type === 'bookmarks' ? '书签' : '历史';
  $panelContent.innerHTML = `<p style="text-align:center;color:var(--text-muted);margin-top:40px;">暂无记录（本设备本地独立隔离）</p>`;
}
function clearData() { if (confirm(t('alertClearData'))) { localStorage.clear(); location.reload(); } }

function reloadPage() {
  var tab = tabs.find(t => t.id === activeTabId);
  if (tab) {
    var currentState = tab.history[tab.historyIndex];
    applyTabState(tab, currentState);
  }
}

function initBackgroundRefresh() {
  setInterval(() => {
    if (document.hidden) {
      detectNetworkLocation();
      fetchWeather();
    }
  }, 300000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      detectNetworkLocation();
      fetchWeather();
    }
  });
}

applyThemeToDOM();
applyLanguage(currentLangSetting);
switchTab('tab_init');
detectNetworkLocation();
fetchWeather();
initBackgroundRefresh();
</script>
</body>
